# Startup order (enforced with depends_on conditions):
#
#   1. opensearch             ─ healthy   (cluster answers, status at least yellow)
#   2. opensearch-dashboards  ─ healthy   (UI/API answers)
#   3. opensearch-init        ─ completed (index template installed, indices created)
#   4. otel-collector         ─ started
#   5. dotnet-log-producer, python-log-producer

services:
  # ------------------------------------------------------------------ 1. OpenSearch
  opensearch:
    image: opensearchproject/opensearch:3.8.0
    container_name: opensearch
    environment:
      discovery.type: single-node                    # no cluster formation, skips production bootstrap checks
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m        # keep the JVM small on a laptop
      DISABLE_SECURITY_PLUGIN: "true"                # LOCAL LEARNING ONLY: plain HTTP, no auth
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    volumes:
      - opensearch-data:/usr/share/opensearch/data   # logs survive `docker compose down` (use -v to wipe)
    ports:
      - "9200:9200"     # REST API, e.g. http://localhost:9200/_cat/indices?v
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health?wait_for_status=yellow || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # ------------------------------------------------------------------ 2. OpenSearch Dashboards
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.8.0
    container_name: opensearch-dashboards
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"     # LOCAL LEARNING ONLY
    ports:
      - "5601:5601"     # UI: http://localhost:5601
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
    depends_on:
      opensearch:
        condition: service_healthy

  # ------------------------------------------------------------------ 3. Create template + indices
  # One-off job: installs the index template and creates the indices, then exits.
  # Runs on every `docker compose up`; it's safe to repeat.
  opensearch-init:
    image: curlimages/curl:8.22.0
    container_name: opensearch-init
    entrypoint: ["sh", "/opensearch/init.sh"]
    volumes:
      - ./opensearch:/opensearch:ro
    depends_on:
      opensearch:
        condition: service_healthy
      opensearch-dashboards:
        condition: service_healthy

  # ------------------------------------------------------------------ 4. OTel Collector
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    container_name: otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"     # OTLP gRPC (still exposed so the apps can also run from the host)
      - "4318:4318"     # OTLP HTTP
      - "13133:13133"   # health_check extension
    depends_on:
      # Only start once the indices exist. This also guarantees OpenSearch is up: the opensearch
      # exporter treats "connection refused" as a permanent error (no retry) and would drop the data.
      opensearch-init:
        condition: service_completed_successfully

  # ------------------------------------------------------------------ 5. Log producers
  # .NET app (service.name dotnet-log-producer) -> index dotnet-log-producer
  dotnet-log-producer:
    build: ./LogProducer
    container_name: dotnet-log-producer
    environment:
      # Inside the compose network, containers reach each other by service name, not localhost.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      opensearch-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started

  # Python app (service.name python-log-producer) -> index python-log-producer
  python-log-producer:
    build: ./LogProducerPython
    container_name: python-log-producer
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      opensearch-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started

volumes:
  opensearch-data:
